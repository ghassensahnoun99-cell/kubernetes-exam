# Cluster kind utilisé par la CI : un seul nœud, comme Docker Desktop.
# Les ports 80/443 du nœud (hostPort du contrôleur ingress-nginx) sont publiés sur le runner : http://localhost
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
