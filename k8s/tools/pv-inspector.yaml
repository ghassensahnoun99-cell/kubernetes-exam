# Pod utilitaire : monte le PVC mysql-pvc en LECTURE SEULE sur /data pour consulter ou copier le contenu du PV.
# Utilisé par scripts/pv-content.sh. ReadWriteOnce autorise plusieurs Pods tant qu'ils sont sur le même nœud que MySQL.
# Rangé dans tools/ : "kubectl apply -f k8s/" ne le crée pas.
apiVersion: v1
kind: Pod
metadata:
  name: pv-inspector
  labels:
    app: pv-inspector
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: inspector
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: mysql-data
          mountPath: /data
          readOnly: true
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: mysql-pvc
        readOnly: true
