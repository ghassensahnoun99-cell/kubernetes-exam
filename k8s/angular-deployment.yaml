apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
  labels:
    app: angular-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: angular-app
  template:
    metadata:
      labels:
        app: angular-app
    spec:
      containers:
        - name: angular-app
          # Image construite localement : Docker Desktop la partage avec son cluster
          image: g4ss99/angular-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            # Remplace le config.js de l'image par celui du ConfigMap angular-config
            - name: runtime-config
              mountPath: /usr/share/nginx/html/assets/config.js
              subPath: config.js
      volumes:
        - name: runtime-config
          configMap:
            name: angular-config
---
apiVersion: v1
kind: Service
metadata:
  name: angular-service
spec:
  # ClusterIP : joignable uniquement via l'Ingress angular-ingress
  type: ClusterIP
  selector:
    app: angular-app
  ports:
    - port: 80
      targetPort: 80
