apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  labels:
    app: spring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      initContainers:
        # Attend que MySQL accepte les connexions avant de démarrer Spring Boot
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-service 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: spring-app
          # Image construite localement : Docker Desktop la partage avec son cluster
          image: g4ss99/spring-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: SERVER_PORT
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: SPRING_DATASOURCE_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: CORS_ALLOWED_ORIGINS
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: SPRING_DATASOURCE_PASSWORD
          # Groupes de santé Kubernetes de Spring Boot (activés automatiquement dans un cluster) : ils ne
          # dépendent pas de MySQL. /actuator/health inclut la base : après un redémarrage de MySQL il répond
          # lentement, Kubernetes retirerait alors tous les Pods du Service (503) et la liveness les tuerait.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
---
# ClusterIP : le navigateur passe par l'Ingress spring-ingress (http://localhost/api/user/...)
apiVersion: v1
kind: Service
metadata:
  name: spring-service
spec:
  type: ClusterIP
  selector:
    app: spring-app
  ports:
    - port: 8081
      targetPort: 8081
